name: Android CI/CD & Release Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Optional manual release notes'
        required: false
        default: 'Automated release build from GitHub Actions'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Determine Release Version
        id: versioning
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "version_name=$TAG_VERSION" >> $GITHUB_OUTPUT
            echo "version_code=$GITHUB_RUN_NUMBER" >> $GITHUB_OUTPUT
            echo "Building with tag version: $TAG_VERSION (code: $GITHUB_RUN_NUMBER)"
          else
            echo "version_name=" >> $GITHUB_OUTPUT
            echo "version_code=" >> $GITHUB_OUTPUT
            echo "Building with default centralized version from gradle.properties"
          fi

      - name: Build Debug & Release APKs
        run: |
          VERSION_ARGS=""
          if [ -n "${{ steps.versioning.outputs.version_name }}" ]; then
            VERSION_ARGS="-Papp.version.name=${{ steps.versioning.outputs.version_name }} -Papp.version.code=${{ steps.versioning.outputs.version_code }}"
          fi
          ./gradlew assembleDebug assembleRelease $VERSION_ARGS --stacktrace

      - name: Stage APK Artifacts
        id: stage-apks
        run: |
          mkdir -p build-artifacts
          
          # Copy debug APK if exists
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/AetherStudio-Elite-debug.apk
            echo "debug_apk_found=true" >> $GITHUB_OUTPUT
          fi
          
          # Copy release APK if exists
          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/AetherStudio-Elite-release-unsigned.apk
            echo "release_apk_found=true" >> $GITHUB_OUTPUT
          elif [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk build-artifacts/AetherStudio-Elite-release.apk
            echo "release_apk_found=true" >> $GITHUB_OUTPUT
          fi
          
          ls -lah build-artifacts/

      - name: Upload APKs to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: aetherstudio-elite-apks
          path: build-artifacts/*
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*
          generate_release_notes: true
          name: AetherStudio Elite ${{ github.ref_name }}
          body: |
            ## ✨ AetherStudio Elite Release ${{ github.ref_name }}
            
            Automated production build generated by GitHub Actions.
            
            ### 📦 Included Artifacts
            - **`AetherStudio-Elite-debug.apk`**: Pre-signed debug build ready for direct side-loading on Android devices.
            - **`AetherStudio-Elite-release-unsigned.apk`**: Production release build (sign with your keystore before Google Play submission).
            
            ### 🚀 Highlights
            - Dual-Mode Creative Workspace (Minimalist Mobile/Tablet & Adobe Illustrator Pro Desktop).
            - Multi-format publication engine: **SVG Vector**, **Photoshop PSD (Layers)**, **TIFF 300 DPI**, PNG, and JPEG.
            - Gemini AI Artistic Vision Coach & Layer Diagnostics.
            - Catmull-Rom exponential brush stabilization and Ibis-grade smart lineart containment.
            
            ${{ github.event.inputs.release_notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
